<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Lead SaaS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"><link rel="stylesheet" href="popup.css"></head>
<body>
<header class="top"><div class="brand"><span class="logo">L</span><span class="name">Lead SaaS</span></div><span id="who" class="who"></span></header>
<main>
  <section id="loading" class="center"><div class="spinner"></div></section>

  <section id="login" hidden>
    <h1>Connexion</h1>
    <p class="muted">Utilise ton compte Lead SaaS habituel.</p>
    <button class="btn ghost google" type="button" id="googleBtn"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>Continuer avec Google</button>
    <div class="sep"><span></span>ou<span></span></div>
    <form id="loginForm">
      <label>E-mail<input id="email" type="email" required autocomplete="email"></label>
      <label>Mot de passe<input id="password" type="password" required autocomplete="current-password"></label>
      <button class="btn primary" type="submit" id="loginBtn">Se connecter</button>
      <p id="loginErr" class="err"></p>
    </form>
    <p class="muted small">Pas de compte ? <a id="signupLink" href="#">Créer un compte sur Lead SaaS</a></p>
  </section>

  <section id="app" hidden>
    <div class="card">
      <span class="eyebrow">Page actuelle</span>
      <form id="addForm">
        <label>Nom du commerce<input id="pName" required></label>
        <label>Site web<input id="pSite" placeholder="Aucun site"></label>
        <div class="row"><label>Téléphone<input id="pPhone"></label><label>Catégorie<input id="pCat"></label></div>
        <label>Adresse<input id="pAddr"></label>
        <button class="btn primary" type="submit" id="addBtn">+ Ajouter aux prospects</button>
        <p id="addMsg" class="small"></p>
      </form>
    </div>
    <div class="section-head"><span class="eyebrow">Derniers prospects</span><a id="openApp" href="#" class="small">Ouvrir Lead SaaS →</a></div>
    <ul id="list" class="list"></ul>
    <button class="btn ghost" id="logout">Se déconnecter</button>
  </section>
</main>
<script type="module" src="popup.js"></script>
</body></html>
